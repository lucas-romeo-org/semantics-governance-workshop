<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>sgw-companion · spike</title>
<style>
:root{--bg:#F9F7F4;--surface:#fff;--ink:#0B2026;--muted:#5A6F77;--line:#DCE0E2;--accent:#FF3621;--ok:#00875C;--bad:#BD2B26;
--sans:"DM Sans",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
header{padding:16px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-size:20px} main{padding:20px 24px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
table{border-collapse:collapse;width:100%} td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted)}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600} code,pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap}
a{color:#2272B4}
</style></head><body>
<header><div class="eyebrow">Semantic governance workshop · wave 8a spike</div><h1>Identity &amp; MCP spike</h1>
<div id="info" class="eyebrow"></div></header>
<main>
 <div class="card"><button class="primary" onclick="runAll()">Run all identities</button>
  <label style="margin-left:12px"><input type="checkbox" id="mcp" checked> include MCP calls (≈30–60 s per identity)</label></div>
 <div class="card"><table id="t"><thead><tr><th>Identity</th><th>current_user</th><th>Metric View regions</th><th>gold</th><th>DBSQL MCP</th><th>Genie One MCP</th></tr></thead><tbody></tbody></table></div>
 <div class="card"><div class="eyebrow">Deep links to check (click each, note which open the right page)</div><ol id="links"></ol></div>
 <div class="card"><div class="eyebrow">Raw</div><pre id="raw"></pre></div>
</main>
<script type="module">
const info = await (await fetch('/api/info')).json();
document.getElementById('info').textContent = `user: ${info.user||'?'} · user token: ${info.has_user_token} · catalog: ${info.catalog}`;
const H = info.host, O = `?o=${info.workspace_id}`;
const links = [
 ['Catalog: gold.fact_sales', `${H}/explore/data/sgw_shop/gold/fact_sales${O}`],
 ['Catalog: gold.fact_sales · Permissions tab', `${H}/explore/data/sgw_shop/gold/fact_sales${O}&activeTab=permissions`],
 ['Catalog: schema gold · Policies tab', `${H}/explore/data/sgw_shop/gold${O}&activeTab=policies`],
 ['Catalog: semantic.sales_metrics · Lineage tab', `${H}/explore/data/sgw_shop/semantic/sales_metrics${O}&activeTab=lineage`],
 ['Discover: domain Retail Sales (a)', `${H}/discover/domains/12697fbd-434f-4417-bdd2-0a74396fa74e${O}`],
 ['Discover: domain Retail Sales (b)', `${H}/explore/discover/domains/12697fbd-434f-4417-bdd2-0a74396fa74e${O}`],
 ['Page: Net Sales (a)', `${H}/discover/pages/06179906-ffb7-485f-ab8e-7a0fe786ea40${O}`],
 ['Page: Net Sales (b)', `${H}/pages/06179906-ffb7-485f-ab8e-7a0fe786ea40${O}`],
 ['Genie Agent', `${H}/genie/rooms/01f1e3a291921fcdaa2b3c84947e2666${O}`],
 ['Dashboard (published)', `${H}/dashboardsv3/01f1e3a291821f1fbe53b21610d18aa8/published${O}`],
 ['Job: sgw · w3 security', `${H}/jobs/207180427784696${O}`],
 ['Group wk_analysts_es', `${H}/settings/workspace/identity-and-access/groups/153617695606878${O}`],
];
document.getElementById('links').innerHTML = links.map(([n,u])=>`<li><a href="${u}" target="_blank">${n}</a> <code>${u.replace(H,'')}</code></li>`).join('');
const cell = c => !c ? '–' : c.ok ? `<span class="ok">✓</span> ${c.detail ?? ''}` : `<span class="bad">✗</span> <code>${(c.error||'').slice(0,140)}</code>`;
window.runAll = async () => {
  const tb = document.querySelector('#t tbody'); tb.innerHTML=''; const raw=[];
  for (const who of ['me','ana','pedro','marta']) {
    const tr = document.createElement('tr'); tr.innerHTML = `<td><b>${who}</b></td><td colspan=5>running…</td>`; tb.appendChild(tr);
    const r = await (await fetch(`/api/spike/${who}?mcp_calls=${document.getElementById('mcp').checked}`)).json(); raw.push(r);
    const mv = r.metric_view; if (mv?.ok) mv.detail = mv.rows.map(x=>x[0]).join(', ');
    const gd = r.gold_denied; const gold = !gd ? '–' : gd.ok ? `<span class="bad">readable!</span>` : `<span class="ok">denied</span>`;
    const db = r.dbsql_mcp; if (db?.ok) db.detail = `${db.state} · ${db.rows.map(x=>x[0]).join(', ')} · ${db.seconds}s`;
    const g1 = r.genie_one_mcp; if (g1?.ok) g1.detail = `${g1.status} · ${g1.seconds}s<br><small>${(g1.answer||'').slice(0,220)}</small>`;
    tr.innerHTML = `<td><b>${who}</b></td><td>${cell(r.identity?.ok?{ok:true,detail:r.identity.user}:r.identity)}</td><td>${cell(mv)}</td><td>${gold}</td><td>${cell(db)}</td><td>${cell(g1)}</td>`;
    document.getElementById('raw').textContent = JSON.stringify(raw, null, 2);
  }
};
</script></body></html>
